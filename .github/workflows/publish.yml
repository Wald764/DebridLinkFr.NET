name: Publish to NuGet

on:
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

  publish:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Check release tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' DebridLinkFrNET/DebridLinkFrNET.csproj)
        if [ "$TAG" != "$VERSION" ]; then
          echo "::error::Release tag '$GITHUB_REF_NAME' does not match <Version>$VERSION</Version> in the csproj."
          exit 1
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Pack
      run: dotnet pack DebridLinkFrNET/DebridLinkFrNET.csproj --no-build --configuration Release --output ./nupkg

    - name: Publish to NuGet
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
